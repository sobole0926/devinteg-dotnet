name: live

# Runs the vendor sandbox tests on demand only, never on a pull request, with secrets from the `live` environment.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dropbox-sign:
    runs-on: ubuntu-latest
    environment: live
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Dropbox Sign sandbox
        env:
          DROPBOX_SIGN_LIVE: '1'
          DROPBOX_SIGN_API_KEY: ${{ secrets.DROPBOX_SIGN_API_KEY }}
          DROPBOX_SIGN_CLIENT_ID: ${{ secrets.DROPBOX_SIGN_CLIENT_ID }}
        run: dotnet test --project tests/DevInteg.DropboxSign.Tests -- --filter-class DevInteg.DropboxSign.Tests.DropboxSignLiveTests
